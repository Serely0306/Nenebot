# Only CN uploaded snapshots; no game-login/profile/ranking endpoints are used.
# Nenebot_tools normalizes compact fields before storing the snapshots.
# upload_time is a Unix timestamp in milliseconds.
cn:
  suite_api_url: "http://127.0.0.1:5000/api/suite/cn/{uid}"
  mysekai_api_url: "http://127.0.0.1:5000/api/mysekai/cn/{uid}"
  mysekai_upload_time_api_url: "http://127.0.0.1:5000/api/mysekai/cn/upload_times"
  mysekai_birthday_events_api_url: "http://127.0.0.1:5000/api/mysekai/cn/birthday_events"
  update_msr_sub_api_url: "http://127.0.0.1:5000/api/mysekai/cn/msr_sub"
